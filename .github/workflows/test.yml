name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"

jobs:
  check:
    name: Foundry build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # MANDATORY: the SDK submodule pulls in OpenZeppelin and forge-std.
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # The gas benchmarks measure with gasleft() around a call, and later releases account
          # for that call differently (~28k higher, one read cold instead of warm), breaking their
          # bounds. Pinned until the benchmarks budget per accounting mode.
          version: v1.5.1

      - name: Show forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build (with sizes)
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
