[package]
name = "gk-diff-extractor"
version = "0.1.0"
edition = "2021"
description = "Thin wrapper around the real Gas Killer analyzer: trace a tx and print the ABI-encoded (StateUpdateType[], bytes[]) storageUpdates diff that verifyAndUpdate consumes."

[[bin]]
name = "gk-diff-extractor"
path = "src/main.rs"

[dependencies]
# The REAL Gas Killer analyzer (https://github.com/BreadchainCoop/gas-killer-analyzer).
# default-features = false keeps the build light: we only use the always-available `core` extraction
# (debug_traceTransaction -> StateUpdate[] -> ABI encoding), not the heavy evmsketch (reth/sp1) or
# anvil (foundry-evm-traces) gas-estimation features.
gas-analyzer-rs = { git = "https://github.com/BreadchainCoop/gas-killer-analyzer", rev = "999d1b0c688627af3ea46c104e9776090f835fda", default-features = false }
alloy-provider = { version = "1.0.37", features = ["debug-api"] }
alloy-primitives = "1.0.37"
alloy-rpc-types-eth = "1.0.37"
alloy-rpc-types-trace = "1.0.37"
alloy-eips = "1.0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
hex = "0.4"
